<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positions</title>
    <link rel="stylesheet" href="./css1.css">
</head>
<body>
    <style>
        .container {
            width: 200px;
            height: 100px;
            background-color: lightblue;
            position: relative;
            left: 50px;
            right: 510px;
        }
        .child {
            width: 100px;
            height: 50px;
            background-color: lightgreen;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(50%, -50%);
            text-align: center;
        }
        </style>
    <div class="container">

</body>
</html>
