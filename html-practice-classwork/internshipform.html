<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <h2>Internship Form</h2>
</head>
<body>
    <form>
        <label for="name">Name:</label><br>
        <input type="text" name="name" placeholder="Enter your name"><br><br>
        <label for="email">Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email"><br><br>
        <label for="phone">Phone Number:</label><br>
        <input type="tel" name="phone" placeholder="Enter your phone number"><br><br>
        <label for="dob">Date of Birth:</label><br>
        <input type="date" name="dob"><br><br>
        <label for="password">Password:</label><br>
        <input type="password" name="password" placeholder="Enter your password"><br><br>
        <input type="radio" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" value="other">
        <label for="other">Other</label><br><br>
        <label for="course">Course:</label><br>
        <select name="course">
            <option value="">CSE</option>
            <option value="">IT</option>
            <option value="">ECE</option>
            <option value="">Mechanical</option>
        </select><br><br>
        <label for="skills">Skills:</label><br>
        <input type="checkbox" name="skills" value="html"> HTML
        <input type="checkbox" name="skills" value="css"> CSS
        <input type="checkbox" name="skills" value="javascript"> JavaScript
        <input type="checkbox" name="skills" value="python"> Python<br><br>
        <label for="preference">Do you prefer remote work?</label><br>
        <input type="radio" name="preference" value="yes">
        <label for="yes">Yes</label>
        <input type="radio" name="preference" value="no">
        <label for="no">No</label><br><br>
        <label for="resume">Upload Resume:</label><br>
        <input type="file" name="resume"><br><br>
        <input type="submit" value="Submit">
    </form>

</body>
</html>
